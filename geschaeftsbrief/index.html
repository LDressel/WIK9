<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Briefprofi Sonnenweg</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: Schreibtisch als Grund, darauf Papierblätter. Kopfleiste mit Luftpost-Streifen.
   Missionsansicht: links die Aufgabe, rechts der wachsende Brief (auf schmalen Bildschirmen darunter).
   Belohnung: Briefmarken im Album, am Ende ein Prüfstempel auf dem eigenen Brief. */
:root{
  --desk:#cdb597; --grain:rgba(90,60,30,.08); --desk-ink:#2e2318;
  --surface:#fffefb; --surface-2:#f5f0e9; --ink:#2a231d; --muted:#6a5e53; --line:#ddd2c4;
  --brand:#23467a; --brand-ink:#ffffff; --brand-soft:#e2e9f4;
  --air-red:#c2413a; --air-blue:#23467a;
  --bar:#1d3150; --bar-ink:#ffffff; --bar-soft:rgba(255,255,255,.12); --bar-line:rgba(255,255,255,.38);
  --sun:#c98d1f; --sun-soft:#fbefd4; --sun-ink:#4d3407; --focus:#d58b1c;
  --ok:#2b6f48; --ok-soft:#dff0e4; --err:#b13d2d; --err-soft:#f7e0da;
  --scrim:rgba(30,20,10,.55);
  --shadow:0 1px 2px rgba(60,40,20,.12),0 8px 22px rgba(60,40,20,.14);
  --note:#fde98c; --note-ink:#2f2709; --note-line:rgba(120,95,20,.25);
  --stamp-red:#b8352c; --stamp-frame:#fffefb;
  --st1:#2f6f8f; --st2:#b0564a; --st3:#4c7a39; --st4:#7c5596; --st5:#b98419; --st6:#2b4d7d; --st7:#5b7d86;
  --av-ink:#ffffff; --av-berger:#7b3f59; --av-mia:#2c6b70; --av-yilmaz:#3d4d89;
  --paper:#ffffff; --paper-ink:#1b1b1b; --paper-muted:#666c74; --paper-line:#c8cdd4; --paper-soft:#f3f5f8;
  --paper-brand:#23467a; --paper-sun:#c98d1f; --paper-wood:#6b4a1f; --paper-hl:#fbefd6;
  --paper-ok:#2b6f48; --paper-ok-soft:#dcefe3; --paper-err:#b13d2d; --paper-err-soft:#f7ddd6; --paper-new:#fff3c2;
  --f-display:"Zilla Slab",Rockwell,Georgia,serif;
  --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --f-letter:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#211a14; --grain:rgba(255,230,200,.035); --desk-ink:#ece2d6;
    --surface:#2a231d; --surface-2:#332a22; --ink:#efe7dd; --muted:#b5a898; --line:#46392e;
    --brand:#93b4e6; --brand-ink:#0f1a2b; --brand-soft:#26324a;
    --bar:#121c2d; --bar-ink:#eef3f8; --bar-soft:rgba(255,255,255,.08); --bar-line:rgba(255,255,255,.25);
    --sun:#e4ad4c; --sun-soft:#3b2e16; --sun-ink:#f6deae; --focus:#e4ad4c;
    --ok:#6cc596; --ok-soft:#183324; --err:#ee8a76; --err-soft:#3d201a;
    --scrim:rgba(0,0,0,.65); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    --note:#e9d47c; --stamp-frame:#efe7dd;
    --av-berger:#a65f7e; --av-mia:#3f8f94; --av-yilmaz:#6475bd;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#211a14; --grain:rgba(255,230,200,.035); --desk-ink:#ece2d6;
  --surface:#2a231d; --surface-2:#332a22; --ink:#efe7dd; --muted:#b5a898; --line:#46392e;
  --brand:#93b4e6; --brand-ink:#0f1a2b; --brand-soft:#26324a;
  --bar:#121c2d; --bar-ink:#eef3f8; --bar-soft:rgba(255,255,255,.08); --bar-line:rgba(255,255,255,.25);
  --sun:#e4ad4c; --sun-soft:#3b2e16; --sun-ink:#f6deae; --focus:#e4ad4c;
  --ok:#6cc596; --ok-soft:#183324; --err:#ee8a76; --err-soft:#3d201a;
  --scrim:rgba(0,0,0,.65); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  --note:#e9d47c; --stamp-frame:#efe7dd;
  --av-berger:#a65f7e; --av-mia:#3f8f94; --av-yilmaz:#6475bd;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html.beamer{font-size:118%}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;
  background-color:var(--desk);
  background-image:repeating-linear-gradient(91deg,transparent 0 37px,var(--grain) 37px 39px,transparent 39px 83px),repeating-linear-gradient(89.4deg,transparent 0 113px,var(--grain) 113px 114px,transparent 114px 197px);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;font-weight:700}
h1{font-size:2.5rem}
h2{font-size:1.75rem}
h3{font-size:1.32rem}
h4{font-size:1.05rem;font-weight:600}
p{margin:0}
ul,ol{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-family:var(--f-body);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ok-t{color:var(--ok);font-weight:700}
.err-t{color:var(--err);font-weight:700}
.kbd{font-family:var(--f-mono);font-size:.82em;padding:.02rem .35rem;border:1px solid currentColor;border-radius:4px;white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopfleiste mit Luftpost-Streifen */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);color:var(--bar-ink);box-shadow:var(--shadow)}
.topbar::after{content:"";display:block;height:6px;background:repeating-linear-gradient(-45deg,var(--air-red) 0 12px,var(--stamp-frame) 12px 18px,var(--air-blue) 18px 30px,var(--stamp-frame) 30px 36px)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:.6rem 1rem;flex-wrap:wrap;padding-block:.5rem}
.brand{display:flex;align-items:center;gap:.6rem;background:none;border:0;color:inherit;cursor:pointer;padding:0;font:inherit;text-align:left}
.brand svg{flex:none}
.brand-t{display:grid;line-height:1.1}
.brand-t b{font-family:var(--f-display);font-size:1.22rem;font-weight:700}
.brand-t small{font-size:.78rem;opacity:.82}
.bar-r{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.22rem .7rem;border-radius:999px;font-size:.86rem;font-weight:600;background:var(--bar-soft);white-space:nowrap}

/* Buttons */
.btn{font:inherit;font-weight:600;line-height:1.2;border-radius:6px;padding:.6rem 1.05rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;gap:.45rem;align-items:center;justify-content:center}
.btn:hover:not([disabled]){border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover:not([disabled]){filter:brightness(1.1)}
.btn.small{padding:.35rem .7rem;font-size:.875rem}
.btn.ghost{background:transparent}
.btn.bar{background:transparent;border-color:var(--bar-line);color:var(--bar-ink)}
.btn.bar:hover{background:var(--bar-soft);border-color:var(--bar-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pick{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.btn.bad{border-color:var(--err);background:var(--err-soft)}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}
.btn:focus-visible,.linkbtn:focus-visible,.opt:focus-visible,.tile:focus-visible,.zone:focus-visible,.chip-btn:focus-visible,.pc:focus-visible,.brand:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* Formulare */
.fld{display:grid;gap:.35rem}
.fld label,.field label{font-weight:600}
input[type=text],input[type=password],textarea{font:inherit;padding:.6rem .75rem;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
input:focus,textarea:focus{outline:3px solid var(--focus);outline-offset:1px;border-color:var(--brand)}
.mono-in{font-family:var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
.fld-group{display:grid;gap:.75rem;padding:1rem;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);align-content:start}
.tgl{display:flex;gap:.55rem;align-items:flex-start;cursor:pointer}
.tgl input{margin-top:.3rem;width:1.05rem;height:1.05rem;accent-color:var(--brand)}

/* Papierflächen */
.main{padding-block:1.4rem 2.5rem;display:grid;gap:1.1rem}
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.4rem}
.foot{padding-block:.5rem 2rem;font-size:.8rem;color:var(--desk-ink);opacity:.85}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.btn.bar{text-decoration:none}
.foot-link{color:inherit;font-weight:600}
.desk-note{color:var(--desk-ink);font-size:.9rem}

/* Haftnotiz */
.note{background:var(--note);color:var(--note-ink);padding:1rem 1.1rem 1.1rem;border-radius:2px;box-shadow:var(--shadow);display:grid;gap:.5rem;position:relative}
.note::before{content:"";position:absolute;top:-9px;left:50%;width:84px;height:18px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,255,255,.45);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note h4,.note .hand{font-family:var(--f-hand);font-size:1.5rem;font-weight:700;line-height:1}
.note ul{padding-left:1.1rem;display:grid;gap:.1rem}
.note.tilt{transform:rotate(-.8deg)}

/* Start */
.start{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:1.6rem;align-items:start}
@media (max-width:820px){.start{grid-template-columns:minmax(0,1fr)}}
.start-hero{display:grid;gap:1rem}
.start-hero h1{color:var(--brand)}
.lead{font-size:1.12rem;color:var(--muted);max-width:54ch}
.start-forms{display:grid;gap:1rem}
.mission-strip{display:flex;gap:.5rem;flex-wrap:wrap}

/* Briefmarken */
.stamp{--c:var(--st1);display:inline-grid;place-items:center;padding:6px;width:64px;height:76px;background:radial-gradient(circle,transparent 3px,var(--stamp-frame) 3.4px) -6px -6px/12px 12px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));flex:none}
.stamp-in{width:100%;height:100%;background:var(--c);color:var(--av-ink);display:grid;grid-template-rows:1fr auto;place-items:center;padding:4px 2px 3px;border-radius:1px}
.stamp-in svg{width:30px;height:30px}
.stamp-in .sv{font:700 .62rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.stamp.empty{background:none;filter:none;border:2px dashed var(--line);border-radius:3px;padding:0}
.stamp.empty .stamp-in{background:transparent;color:var(--muted)}
.stamp.big{width:96px;height:114px;padding:8px;background-size:14px 14px;background-position:-7px -7px}
.stamp.big .stamp-in svg{width:46px;height:46px}
.stamp.big .stamp-in .sv{font-size:.78rem}
.stamp-stars{font-size:.6rem;letter-spacing:.05em}
.stamp.big .stamp-stars{font-size:.85rem}
.pstamp{display:inline-block;border:3px double var(--stamp-red);color:var(--stamp-red);font:700 .95rem/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.12em;padding:.35rem .7rem;border-radius:6px;transform:rotate(-9deg);text-align:center;opacity:.9}
.pstamp small{display:block;font:600 .62rem/1.2 var(--f-body);letter-spacing:.08em}

/* Schreibtisch (Übersicht) */
.desk-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:1.2rem;align-items:start}
@media (max-width:1000px){.desk-top{grid-template-columns:minmax(0,1fr)}}
.desk-main{display:grid;gap:1.1rem;min-width:0}
.hello{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem 1.5rem;align-items:center}
@media (max-width:640px){.hello{grid-template-columns:minmax(0,1fr)}}
.progress{display:flex;align-items:center;gap:.6rem;margin-top:.6rem;font-weight:600}
.progress .bar{flex:1;max-width:260px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--ok)}
.codebox{display:grid;gap:.2rem;background:var(--surface-2);border:1px dashed var(--line);border-radius:6px;padding:.65rem .85rem}
.code{font-family:var(--f-mono);font-size:1.05rem;letter-spacing:.06em;user-select:all;overflow-wrap:anywhere}
.postcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.pc{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.4rem .8rem;text-align:left;padding:1rem 1rem .9rem 1.1rem;border:0;border-radius:4px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;box-shadow:var(--shadow);align-items:start}
.pc:hover:not([disabled]){transform:translateY(-2px)}
.pc[disabled]{cursor:not-allowed;opacity:.62}
.pc.next{outline:3px solid var(--sun);outline-offset:0}
.pc .pc-body{display:grid;gap:.25rem;min-width:0}
.pc .pc-no{font-family:var(--f-hand);font-size:1.35rem;color:var(--muted);line-height:1}
.pc .pc-title{font-family:var(--f-display);font-weight:700;font-size:1.16rem;line-height:1.15}
.pc .pc-meta{font-size:.85rem;color:var(--muted)}
.pc .pc-lines{grid-column:1/-1;height:16px;background:repeating-linear-gradient(transparent 0 7px,var(--line) 7px 8px);opacity:.7}
.pc.bonus{background:var(--surface-2)}
.pc .tag{font-size:.72rem;font-weight:700;padding:.1rem .45rem;border-radius:999px;background:var(--sun-soft);color:var(--sun-ink);justify-self:start}
.album{display:grid;gap:.7rem}
.album-row{display:flex;flex-wrap:wrap;gap:.6rem}

/* Mission */
.mission{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:1.2rem;align-items:start}
@media (max-width:1000px){.mission{grid-template-columns:minmax(0,1fr)}}
.m-main{display:grid;gap:1.2rem;min-width:0}
.m-head{display:grid;gap:.4rem}
.m-top{display:flex;justify-content:space-between;gap:.75rem;align-items:center;flex-wrap:wrap}
.stepbar{display:flex;gap:4px;margin-top:.3rem}
.stepbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.stepbar i.done{background:var(--ok)}
.stepbar i.now{background:var(--sun)}

/* wachsender Brief */
.m-letter{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:grid;gap:.5rem}
@media (max-width:1000px){.m-letter{position:static}}
.lp-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;color:var(--desk-ink)}
.lp-head .hand{font-family:var(--f-hand);font-size:1.6rem;line-height:1}
.lp-head .btn{background:var(--surface)}
details.lp-fold > summary{list-style:none;cursor:pointer}
details.lp-fold > summary::-webkit-details-marker{display:none}
.lp-sum{display:flex;justify-content:space-between;align-items:center;gap:.5rem;background:var(--surface);border-radius:6px;padding:.6rem .8rem;box-shadow:var(--shadow);font-weight:600}

/* Brief (Papier) */
.letter{background:var(--paper);color:var(--paper-ink);font-family:var(--f-letter);font-size:.84rem;line-height:1.45;box-shadow:var(--shadow);padding:1.4rem 1.5rem 1rem 2.2rem;width:100%;max-width:720px;margin:0 auto;min-width:0;position:relative}
.letter.lp{font-size:.6rem;padding:1rem .9rem .7rem 1.35rem;max-width:none}
.letter.mini{padding:.9rem 1.1rem;box-shadow:none;border:1px solid var(--paper-line)}
.lt-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-bottom:.5em;margin-bottom:1.1em;border-bottom:2px solid var(--paper-brand)}
.lt-head.wood{border-bottom-color:var(--paper-wood)}
.lt-firm{font-family:var(--f-display);font-weight:700;font-size:1.55em;color:var(--paper-brand);line-height:1.05}
.lt-head.wood .lt-firm{color:var(--paper-wood)}
.lt-slogan{font-size:.85em;color:var(--paper-muted)}
.lt-head svg{width:3.6em;height:3.6em;flex:none}
.lt-top{display:grid;grid-template-columns:minmax(11em,1fr) minmax(0,max-content);gap:1.4em;margin-bottom:1.6em}
.letter:not(.lp) .lt-top{min-height:9em}
@media (max-width:560px){.letter:not(.lp) .lt-top{grid-template-columns:minmax(0,1fr)}}
.rsa{font-size:.74em;color:var(--paper-muted);border-bottom:1px solid var(--paper-line);padding-bottom:.15em;margin-bottom:.45em}
.addr .al,.addr .seg{display:block}
.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.1em .8em;line-height:1.5;font-size:.95em;align-content:start;font-family:var(--f-letter);color:var(--paper-ink)}
.info .lw{color:var(--paper-muted);font-size:.88em;white-space:nowrap;padding-top:.07em}
.info .gap{grid-column:1/-1;height:.75em}
.info span{overflow-wrap:anywhere}
.hl{background:var(--paper-hl);border-radius:2px;padding:0 .15em}
.lt-betreff{font-weight:700;margin-bottom:1.3em}
.lt-p{margin:0 0 .85em}
.lt-sig{font-family:var(--f-hand);font-size:1.5em;color:var(--paper-brand);line-height:1}
.lt-sigrow{display:flex;align-items:baseline;gap:.45em;margin:.4em 0 .1em}
.lt-foot{margin-top:1.4em;padding-top:.5em;border-top:1px solid var(--paper-line);font-size:.74em;color:var(--paper-muted);display:grid;gap:.1em}
.lt-foot .seg{display:block}
.slot-ph{border:1.5px dashed var(--paper-line);border-radius:3px;color:var(--paper-muted);font-family:var(--f-body);font-weight:600;font-size:.95em;padding:.45em .6em;margin-bottom:.9em;background:repeating-linear-gradient(-45deg,transparent 0 6px,var(--paper-soft) 6px 12px)}
.lt-top .slot-ph{margin-bottom:0;min-height:7em;display:grid;place-items:center;text-align:center}
.new{animation:glow 2.4s ease-out 1}
@keyframes glow{0%{background:var(--paper-new);box-shadow:0 0 0 4px var(--paper-new)}100%{background:transparent;box-shadow:0 0 0 0 transparent}}
.letter .pstamp{position:absolute;right:8%;bottom:14%;font-size:1.25em}
.letter.lp .pstamp{font-size:.95em;border-width:2px}

/* Gespräch und Merkzettel */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.4rem;align-items:start}
@media (max-width:760px){.intro{grid-template-columns:minmax(0,1fr)}}
.story{display:grid;gap:.85rem;align-content:start}
.say{display:flex;gap:.7rem;align-items:flex-start;animation:rise .35s ease both}
.say:nth-child(2){animation-delay:.25s}
.say:nth-child(3){animation-delay:.5s}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--av-ink);font-family:var(--f-display);font-weight:700;font-size:1rem;flex:none}
.say-b{min-width:0}
.who{font-size:.82rem;color:var(--muted);margin-bottom:.15rem}
.who b{color:var(--ink)}
.bubble{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:.6rem .9rem;font-size:1.04rem}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mz-rows{display:grid;gap:.45rem}
.mz-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.2rem .8rem;align-items:baseline;padding-bottom:.4rem;border-bottom:1px solid var(--note-line)}
.mz-row:last-child{border-bottom:0;padding-bottom:0}
@media (max-width:520px){.mz-row{grid-template-columns:minmax(0,1fr)}}
.mz-row .ex{font-family:var(--f-letter);font-size:.88rem;background:rgba(255,255,255,.55);padding:.1rem .4rem;border-radius:3px;justify-self:start;overflow-wrap:anywhere}
.mz-ref{font-size:.82rem;font-weight:700;opacity:.8}
.mz-visual{background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:.7rem;overflow-x:auto}
.foot-row{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;padding-top:.9rem;border-top:1px dashed var(--line)}

/* Übung */
.ex{display:grid;gap:1rem}
.ex-head{display:grid;gap:.4rem}

/* ===== Fortsetzungscode ===== */
function normName(n){ return String(n).trim().toLowerCase().replace(/\s+/g,' '); }
function fnv(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h>>>0; }
function chk(name,body){ return (fnv(normName(name)+'|'+body)%1296).toString(36).toUpperCase().padStart(2,'0'); }
function makeCode(name,stars){
  let n=0n; for(let i=stars.length-1;i>=0;i--){ n=n*4n+BigInt(stars[i]&3); }
  const body=n.toString(36).toUpperCase().padStart(6,'0');
  return ('C'+body+chk(name,body)).match(/.{1,5}/g).join('-');
}
function readCode(name,code){
  const c=String(code||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
  if(c.length!==9||c[0]!=='C') return null;
  const body=c.slice(1,7);
  if(c.slice(7)!==chk(name,body)) return null;
  let n=0n; for(const ch of body){ const v=parseInt(ch,36); if(isNaN(v)) return null; n=n*36n+BigInt(v); }
  const st=[]; for(let i=0;i<NS;i++){ st.push(Number(n%4n)); n=n/4n; }
  return n===0n?st:null;
}

function copyCode(btn,text,target){
  const ok=()=>{ btn.textContent='Kopiert'; setTimeout(()=>{ btn.textContent='Code kopieren'; },1600); };
  const fb=()=>{ try{ const r=document.createRange(); r.selectNodeContents(target); const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent='Markiert – jetzt Strg + C'; }catch(e){} };
  try{ navigator.clipboard.writeText(text).then(ok,fb); }catch(e){ fb(); }
}

function startMission(mi){ if(!msOpen(mi)) return; let si=S.pos[mi]|0; if(si>=MS[mi].steps.length) si=0; go('mission',{mi,si}); }

function renderMission(){
  const m=MS[V.mi], st=m.steps[V.si], wide=st.type==='finale';
  const head=`<div class="m-head"><div class="m-top"><button class="linkbtn" type="button" id="b-back">← Zum Schreibtisch</button><span class="small muted">Schritt ${V.si+1} von ${m.steps.length}</span></div><span class="eyebrow">${m.bonus?'Bonus-Mission':'Mission '+(V.mi+1)} · ${esc(m.time)}</span><h2>${esc(m.title)}</h2><div class="stepbar" aria-hidden="true">${m.steps.map((s,i)=>`<i class="${i<V.si?'done':i===V.si?'now':''}"></i>`).join('')}</div></div>`;
  main.innerHTML=wide?`<section class="panel m-main">${head}<div id="stage"></div></section>`:`<div class="mission"><section class="panel m-main">${head}<div id="stage"></div></section>${letterAside(-1)}</div>`;
  $('#b-back').onclick=()=>go('home');

function stepDone(st,stars){
  if(st.sid!==undefined&&stars) S.stars[st.sid]=Math.max(S.stars[st.sid],stars);
  const m=MS[V.mi];
  if(V.si+1<m.steps.length){ S.pos[V.mi]=V.si+1; save(); go('mission',{si:V.si+1}); }
  else { S.pos[V.mi]=0; save(); go(V.mi===CORE-1?'zeugnis':'done'); }
}

function exFrame(st,root,done){
  root.innerHTML=`<div class="ex"><div class="ex-head"><div><span class="badge ${st.boss?'boss':''}">${st.boss?'Mini-Boss':'Übung'}</span></div><h3>${esc(st.title)}</h3><p class="task">${fill(st.task)}</p></div><div class="ex-body"></div><div class="hint-area"></div><div class="fb-area" aria-live="polite"></div><div class="ex-foot"><div class="left"><button class="btn small ghost" type="button" data-hint>Frag Mia</button><span class="mist">Fehlversuche: 0</span></div><div class="right"></div></div></div>`;
  const T={mist:0,hint:false,sol:false,body:$('.ex-body',root),right:$('.right',root)};
  const mistEl=$('.mist',root), hintArea=$('.hint-area',root), fbArea=$('.fb-area',root), hintBtn=$('[data-hint]',root);
  T.addMist=()=>{ T.mist++; mistEl.textContent='Fehlversuche: '+T.mist; };
  hintBtn.onclick=()=>{ T.hint=true; hintArea.innerHTML=`<div class="note hintbox">${avHtml('mia')}<div><span class="hand">Mia hilft dir</span><div>${st.hint}</div><div class="small">Ein Tipp kostet dich höchstens einen Stern.</div></div></div>`; };
  T.fb=(cls,html)=>{ fbArea.innerHTML=html?`<div class="fb ${cls}">${html}</div>`:''; };
  T.setRight=(html,handlers)=>{ T.right.innerHTML=html; if(handlers) Object.keys(handlers).forEach(id=>{ const b=T.right.querySelector('#'+id); if(b) b.onclick=handlers[id]; }); };
  T.stars=()=>{ if(T.sol) return 1; const tol=st.tol===undefined?2:st.tol; let s=T.mist===0?3:(T.mist<=tol?2:1); if(T.hint) s=Math.min(s,2); return s; };
  T.finish=prefix=>{
    const s=T.stars(); const words=['','Geschafft. Beim nächsten Mal klappt es noch besser.','Gut gemacht!','Perfekt, ohne Fehler!'];
    T.fb('ok',`${prefix?`<div>${prefix}</div>`:''}<div class="earned">${starsHtml(s,3)}<span>${words[s]}</span></div>`);
    T.setRight('<button class="btn primary" type="button" id="x-next">Weiter</button>',{'x-next':()=>done(s)});
    hintBtn.disabled=true;
    const nb=$('#x-next',root); if(nb){ try{ nb.focus({preventScroll:true}); }catch(e){ nb.focus(); } }
  };
  return T;
}
function addrBox(s){ return `<span class="addr-box">${String(s).split('\n').map(l=>l===''?'<span class="el" title="Leerzeile"></span>':`<span class="al">${esc(l)}</span>`).join('')}</span>`; }
function noteHtml(n){ return `<div class="note"><span class="hand">${esc(n.title)}</span><div class="mz-rows">${n.rows.map(r=>`<div class="mz-row"><span>${esc(r[0])}</span><span class="ex">${esc(r[1])}</span></div>`).join('')}</div>${n.visual?`<div class="mz-visual">${n.visual}</div>`:''}<span class="mz-ref">Ausführlich: ${esc(n.ref)}</span></div>`; }

  root.innerHTML=`<div class="intro"><div class="story">${st.lines.map(l=>`<div class="say">${avHtml(l.who)}<div class="say-b"><div class="who"><b>${esc(P[l.who].name)}</b> · ${esc(P[l.who].role)}</div><div class="bubble">${fill(l.text)}</div></div></div>`).join('')}</div>${noteHtml(st.note)}</div><div class="foot-row" style="margin-top:1rem"><span class="small muted">Den Merkzettel findest du oben jederzeit wieder.</span><button class="btn primary" type="button" id="go">Los geht's</button></div>`;
  const b=$('#go',root); b.onclick=()=>done(); try{ b.focus({preventScroll:true}); }catch(e){}

R.mc=(st,root,done)=>{
  const T=exFrame(st,root,done); let qi=0;
  function showQ(){
    const q=st.questions[qi], order=shuffle(q.options.map((_,k)=>k)); let solved=false;
    T.body.innerHTML=`<div class="qcount">Frage ${qi+1} von ${st.questions.length}</div>${q.context?`<div class="ctx">${q.context}</div>`:''}<p class="q">${esc(q.q)}</p><div class="opts ${q.addr?'addr':''}">${order.map(k=>`<button type="button" class="opt" data-k="${k}">${q.addr?addrBox(q.options[k]):esc(q.options[k])}</button>`).join('')}</div>`;
    T.fb('',''); T.setRight('');
    $$('.opt',T.body).forEach(b=>b.onclick=()=>{
      if(solved||b.classList.contains('wrong')) return;
      const k=+b.dataset.k;
      if(k===q.correct){
        solved=true; b.classList.add('right'); $$('.opt',T.body).forEach(o=>o.disabled=true);
        const msg=`<b>Richtig.</b> ${q.explain||''}`;
        if(qi<st.questions.length-1){ T.fb('ok',msg); T.setRight('<button class="btn primary" type="button" id="x-q">Nächste Frage</button>',{'x-q':()=>{ qi++; showQ(); }}); $('#x-q',T.right).focus({preventScroll:true}); }
        else T.finish(msg);
      } else {
        b.classList.add('wrong'); T.addMist();
        const w=q.why&&q.why[k]; T.fb('err',`<b>Nicht ganz.</b> ${w||'Versuch es noch einmal.'}`);
      }
    });
  }
  showQ();
};
R.classify=(st,root,done)=>{
  const T=exFrame(st,root,done);
  const items=shuffle(st.items.map((it,i)=>i)); let left=items.length;
  T.body.innerHTML=`<div class="cls">${items.map(i=>{ const it=st.items[i]; return `<div class="cls-row" data-i="${i}"><div class="cls-text"><div>${it.html||esc(it.text)}</div><div class="cls-why"></div></div><div class="cls-btns">${st.cats.map((c,ci)=>`<button class="btn small" type="button" data-c="${ci}">${esc(c)}</button>`).join('')}</div></div>`; }).join('')}</div>`;
  $$('.cls-row',T.body).forEach(row=>{
    const it=st.items[+row.dataset.i], why=$('.cls-why',row);
    $$('[data-c]',row).forEach(b=>b.onclick=()=>{
      if(row.classList.contains('done')) return;
      const c=+b.dataset.c;
      if(c===it.cat){
        row.classList.add('done'); b.classList.add('pick'); $$('[data-c]',row).forEach(x=>x.disabled=true);
        why.innerHTML=`<span class="ok-t">✓ ${esc(st.cats[c])}.</span> ${it.why||''}`; left--;
        if(left===0) T.finish('Alles richtig zugeordnet.'); else T.fb('','');
      } else {
        T.addMist(); b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),900);
        why.innerHTML=`<span class="err-t">Nicht „${esc(st.cats[c])}“.</span> Überleg noch einmal.`;
      }
    });
  });
};
R.order=(st,root,done)=>{
  const T=exFrame(st,root,done); const n=st.items.length;
  const fresh=()=>{ let p=shuffle(st.items.map((_,i)=>i)); if(n>1&&p.every((v,i)=>v===i)) p.reverse(); return p; };
  let pool=fresh(), tgt=[], marks=null, checks=0, locked=false;
  const tile=(i,w,p)=>`<button type="button" class="tile ${w==='t'&&marks?(marks[p]?'ok':'bad'):''}" data-w="${w}" data-i="${i}">${w==='t'?`<span class="num">${p+1}</span>`:''}<span>${esc(st.items[i])}</span></button>`;
  function draw(){
    T.body.innerHTML=`<div class="ord"><div><div class="col-lab">Bausteine – zum Einsortieren anklicken</div><div class="pool">${pool.length?pool.map(i=>tile(i,'p')).join(''):'<p class="small muted">Alle Bausteine sind einsortiert.</p>'}</div></div><div><div class="col-lab">Deine Reihenfolge</div><ol class="target ${locked?'locked':''}">${Array.from({length:n},(_,p)=>tgt[p]!==undefined?`<li>${tile(tgt[p],'t',p)}</li>`:`<li class="slot">Platz ${p+1}</li>`).join('')}</ol></div></div>`;
    $$('.tile',T.body).forEach(b=>b.onclick=()=>{
      if(locked) return; const i=+b.dataset.i;
      if(b.dataset.w==='p'){ pool=pool.filter(x=>x!==i); tgt.push(i); } else { tgt=tgt.filter(x=>x!==i); pool.push(i); }
      marks=null; draw();
    });
    if(!locked) T.setRight(`${checks>=2?'<button class="btn" type="button" id="x-sol">Lösung zeigen</button>':''}<button class="btn" type="button" id="x-reset">Neu mischen</button><button class="btn primary" type="button" id="x-check" ${tgt.length<n?'disabled':''}>Prüfen</button>`,{
      'x-check':check,
      'x-reset':()=>{ pool=fresh(); tgt=[]; marks=null; T.fb('',''); draw(); },
      'x-sol':()=>{ T.sol=true; tgt=st.items.map((_,i)=>i); pool=[]; marks=tgt.map(()=>true); locked=true; draw(); T.finish('So ist die richtige Reihenfolge. Präge sie dir gut ein.'); }
    });
  }
  function check(){
    marks=tgt.map((v,p)=>v===p); const good=marks.filter(Boolean).length;
    if(good===n){ locked=true; draw(); T.finish('Die Reihenfolge stimmt.'); }
    else { checks++; T.addMist(); draw(); T.fb('err',`<b>${good} von ${n}</b> stehen schon richtig. Klicke die rot markierten Bausteine an, um sie zurückzulegen, und sortiere neu.`); }
  }
  draw();
};
R.assign=(st,root,done)=>{
  const T=exFrame(st,root,done); const zones=st.zones; let sel=null; const placed=new Set();
  const zById=id=>zones.find(z=>z.id===id);
  T.body.innerHTML=`<div class="asg"><div><div class="col-lab">Bausteine</div><div class="chips">${shuffle(zones.map(z=>z.id)).map(id=>`<button type="button" class="chip-btn" draggable="true" data-id="${id}">${esc(zById(id).label)}</button>`).join('')}</div></div><div>${sheetHtml(zones,'play')}</div></div>`;
  const chips=$$('.chip-btn',T.body);
  const select=id=>{ sel=id; chips.forEach(x=>x.classList.toggle('sel',x.dataset.id===sel)); };
  chips.forEach(b=>{
    b.onclick=()=>{ select(sel===b.dataset.id?null:b.dataset.id); if(sel) T.fb('',`Klicke jetzt auf den Bereich für <b>${esc(zById(sel).label)}</b>.`); };
    b.addEventListener('dragstart',e=>{ try{ e.dataTransfer.setData('text/plain',b.dataset.id); }catch(_){} select(b.dataset.id); });
  });
  $$('.zone',T.body).forEach(z=>{
    z.onclick=()=>{ if(!sel){ T.fb('','Wähle zuerst links einen Baustein aus.'); return; } attempt(sel,z); };
    z.addEventListener('dragover',e=>e.preventDefault());
    z.addEventListener('drop',e=>{ e.preventDefault(); let id=''; try{ id=e.dataTransfer.getData('text/plain'); }catch(_){} attempt(id||sel,z); });
  });
  function attempt(id,zEl){
    const zid=zEl.dataset.z; if(!id||placed.has(zid)) return; const zc=zById(id);
    if(id===zid){
      placed.add(zid); zEl.classList.add('filled'); zEl.innerHTML=`<span>${esc(zc.label)}</span>`; zEl.disabled=true;
      chips.find(x=>x.dataset.id===id).classList.add('used'); select(null);
      if(placed.size===zones.length) T.finish('Der Briefbogen ist komplett.');
      else T.fb('ok',`<b>${esc(zc.label)}</b> sitzt. Noch ${zones.length-placed.size} Bausteine.`);
    } else {
      T.addMist(); zEl.classList.remove('shake'); void zEl.offsetWidth; zEl.classList.add('shake');
      T.fb('err',`Das passt hier nicht. Tipp zu <b>${esc(zc.label)}</b>: ${zc.tip}`);
    }
  }
};
function fieldMsg(f,v){
  if(f.check) return f.check(v);
  if(f.empty) return v===''?null:(f.emptyMsg||'Dieses Leitwort bleibt leer. Lösche den Eintrag.');
  if(f.answers.some(a=>f.ci?a.toLowerCase()===v.toLowerCase():a===v)) return null;
  if(v==='') return 'Hier fehlt noch ein Eintrag.';
  for(const h of (f.hints||[])){ if(h.re.test(v)) return h.msg; }
  return f.msg||'Das stimmt noch nicht.';
}
R.input=(st,root,done)=>{
  const T=exFrame(st,root,done); let checks=0; const key='in'+st.sid;
  T.body.innerHTML=`${st.context?`<div class="ctx">${fill(st.context)}</div>`:''}${st.timer?'<div class="timer">Diktat-Zeit: <b id="tm">0:00</b> min</div>':''}<form class="fields" autocomplete="off" novalidate>${st.fields.map((f,i)=>`<div class="field" data-i="${i}"><label for="${key}-${i}">${esc(f.label)}</label><input type="text" id="${key}-${i}" spellcheck="false" autocomplete="off"${f.empty?' placeholder="(leer lassen, wenn nicht nötig)"':''}><div class="f-msg"></div></div>`).join('')}<button type="submit" hidden>Prüfen</button></form>`;
  let iv=null; const t0=Date.now();
  if(st.timer){ const tm=$('#tm',T.body); iv=setInterval(()=>{ const s=Math.floor((Date.now()-t0)/1000); tm.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); },1000); cleanups.push(()=>clearInterval(iv)); }
  const form=$('form',T.body); form.onsubmit=e=>{ e.preventDefault(); check(); };
  const inp=i=>$('#'+key+'-'+i,T.body);
  function lock(){ if(iv) clearInterval(iv); $$('input',form).forEach(x=>x.readOnly=true); st.fields.forEach((f,i)=>{ if(f.store) S.vals[f.store]=inp(i).value.replace(/\s+/g,' ').trim(); }); save(); }
  function setBtns(){ T.setRight(`${checks>=2?'<button class="btn" type="button" id="x-sol">Lösung zeigen</button>':''}<button class="btn primary" type="button" id="x-check">Prüfen</button>`,{'x-check':check,'x-sol':()=>{
    T.sol=true;
    st.fields.forEach((f,i)=>{ const el=inp(i), fd=el.closest('.field'); if(fieldMsg(f,el.value.replace(/\s+/g,' ').trim())!==null) el.value=f.empty?'':(typeof f.example==='function'?f.example():(f.example||(f.answers?f.answers[0]:''))); fd.classList.remove('bad'); fd.classList.add('ok'); $('.f-msg',fd).textContent=f.empty?'bleibt leer':''; });
    lock(); T.finish('Hier siehst du die Lösung. Vergleiche sie mit deinen Eingaben.');
  }}); }
  function check(){
    let wrong=0;
    st.fields.forEach((f,i)=>{
      const el=inp(i), v=el.value.replace(/\s+/g,' ').trim(), fd=el.closest('.field'), msg=fieldMsg(f,v), ok=msg===null;
      fd.classList.toggle('ok',ok); fd.classList.toggle('bad',!ok);
      $('.f-msg',fd).textContent=ok?(f.empty?'✓ richtig, bleibt leer':'✓'):msg;
      if(!ok) wrong++;
    });
    if(wrong===0){ lock(); const tm=st.timer?$('#tm',T.body).textContent:''; T.finish('Alles korrekt eingetragen.'+(st.timer?` Deine Zeit: ${tm} min.`:'')); }
    else { checks++; T.addMist(); setBtns(); T.fb('err',`<b>${wrong===1?'Ein Eintrag stimmt':wrong+' Einträge stimmen'} noch nicht.</b> Lies die roten Hinweise und verbessere.`); const fb=$('.field.bad input',T.body); if(fb) fb.focus(); }
  }
  setBtns();
};
function diagLines(L,t){
  const A=t.answers[0];
  if(!L.length) return 'Du hast noch nichts eingetragen.';
  if(L.some(l=>l==='')) return 'Hier stehen keine Leerzeilen – auch nicht vor dem Ort.';
  if(/^an$/i.test(L[0])) return '„An“ schreibt man nicht in die Anschrift.';
  if(L.some(l=>/^Herr\s/.test(l)||l==='Herr')) return 'In der Anschrift schreibt man „Herrn“ (mit n).';
  if(L.some(l=>/,$/.test(l))) return 'Am Zeilenende stehen keine Kommas.';
  if(t.country){
    const last=L[L.length-1];
    if(last.toUpperCase()===t.country&&last!==t.country) return `Das Land schreibst du in Großbuchstaben: ${t.country}.`;
    if(!L.some(l=>l.toUpperCase()===t.country)) return `Bei Auslandsbriefen steht das Land in der letzten Zeile: ${t.country}.`;
    if(last.toUpperCase()!==t.country) return 'Das Land steht ganz unten in der letzten Zeile.';
  }
  for(let k=0;k<Math.min(L.length,A.length);k++){
    if(!t.answers.some(a=>a[k]===L[k])) return `Zeile ${k+1} stimmt noch nicht. Dort gehört hin: ${t.kinds[k]}.${L[k].toLowerCase()===A[k].toLowerCase()?' Achte auf Groß- und Kleinschreibung.':''}`;
  }
  if(L.length>A.length) return `Du hast ${L.length} Zeilen. Nötig sind nur ${A.length}.`;
  if(L.length<A.length) return `Es fehlt noch eine Zeile: ${t.kinds[L.length]}.`;
  return 'Vergleiche noch einmal genau mit der Vorlage.';
}
R.lines=(st,root,done)=>{
  const T=exFrame(st,root,done); let ti=0, checks=0;
  function show(){
    const t=st.tasks[ti], id='ln'+st.sid+'-'+ti; checks=0;
    T.body.innerHTML=`${st.tasks.length>1?`<div class="qcount">Brief ${ti+1} von ${st.tasks.length}</div>`:''}<div class="ctx-grid"><div class="ctx">${t.context}</div><div class="fld"><label for="${id}">${esc(t.label||'Anschriftzone – eine Angabe pro Zeile')}</label><textarea id="${id}" class="addr-in" rows="7" spellcheck="false"></textarea><p class="small muted">Drücke nach jeder Zeile die Taste <span class="kbd">Enter</span>.</p></div></div>`;
    T.fb(''); setBtns();
  }
  function setBtns(){ T.setRight(`${checks>=2?'<button class="btn" type="button" id="x-sol">Lösung zeigen</button>':''}<button class="btn primary" type="button" id="x-check">Prüfen</button>`,{'x-check':check,'x-sol':()=>{ T.sol=true; const ta=$('textarea',T.body); ta.value=st.tasks[ti].answers[0].join('\n'); ta.readOnly=true; next('So sieht es richtig aus.'); }}); }
  function next(msg){
    if(ti<st.tasks.length-1){ T.fb('ok',msg+' Weiter mit dem nächsten Brief.'); T.setRight('<button class="btn primary" type="button" id="x-n">Nächster Brief</button>',{'x-n':()=>{ ti++; show(); }}); }
    else T.finish(msg);
  }
  function check(){
    const t=st.tasks[ti], ta=$('textarea',T.body);
    const L=ta.value.split(/\r?\n/).map(s=>s.replace(/\s+/g,' ').trim());
    while(L.length&&L[0]==='') L.shift(); while(L.length&&L[L.length-1]==='') L.pop();
    if(t.answers.some(a=>a.length===L.length&&a.every((x,k)=>x===L[k]))){ ta.readOnly=true; next('Richtig adressiert!'); return; }
    checks++; T.addMist(); setBtns(); T.fb('err',esc(diagLines(L,t)));
  }
  show();
};
R.errors=(st,root,done)=>{
  const T=exFrame(st,root,done); const found=new Set(), keys=Object.keys(st.errs), total=keys.length; let finished=false;
  T.body.innerHTML=`<div class="err-grid"><div style="min-width:0">${st.letter}</div><aside class="err-side" aria-live="polite"><div class="err-count"><b id="ec">0</b> von ${total} Fehlern gefunden</div><ol class="err-list" id="el"></ol></aside></div>`;
  const letter=$('.letter',T.body);
  const addFound=k=>{ found.add(k); $$(`[data-e="${k}"]`,letter).forEach(x=>x.classList.add('found')); $('#el',T.body).insertAdjacentHTML('beforeend',`<li><b>${esc(st.errs[k].what)}</b><br>Richtig: <span class="fix">${esc(st.errs[k].fix)}</span></li>`); $('#ec',T.body).textContent=found.size; };
  function setBtns(){ T.setRight(T.mist>=6&&!finished?'<button class="btn" type="button" id="x-sol">Alle Fehler zeigen</button>':'',{'x-sol':()=>{ T.sol=true; keys.forEach(k=>{ if(!found.has(k)) addFound(k); }); finished=true; letter.classList.remove('check'); T.finish('Hier sind alle Fehler markiert. Lies die Verbesserungen genau.'); }}); }
  letter.addEventListener('click',ev=>{
    if(finished) return;
    const e=ev.target.closest('[data-e]');
    if(e){ const k=e.dataset.e; if(found.has(k)){ T.fb('','Diesen Fehler hast du schon gefunden.'); return; }
      addFound(k);
      if(found.size===total){ finished=true; letter.classList.remove('check'); T.finish('Alle Fehler gefunden!'); }
      else { T.fb('ok',`<b>Gefunden:</b> ${esc(st.errs[k].what)}. Noch ${total-found.size}.`); setBtns(); }
      return; }
    const s=ev.target.closest('.seg');
    if(s){ T.addMist(); s.classList.add('nope'); setTimeout(()=>s.classList.remove('nope'),800); T.fb('err','Das ist so korrekt. Such weiter!'); setBtns(); }
  });
  setBtns();
};
R.finale=(st,root,done)=>{
  root.innerHTML=`<div style="display:grid;gap:1.4rem"><div class="done-grid">${stampHtml(V.mi,true)}<div class="done-text"><span class="eyebrow">Alle Missionen geschafft</span><h2>Dein Brief ist fertig und geprüft</h2><p>Jeden Teil dieses Briefs hast du selbst gebaut. Genau so schreibst du ab jetzt jeden Geschäftsbrief.</p></div></div>
  ${letterHtml('')}
  <section class="transfer"><div class="note tilt"><span class="hand">${esc(TRANSFER.title)}</span><p>${esc(TRANSFER.task)}</p><ul>${TRANSFER.data.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="panel" style="box-shadow:none;border:1px dashed var(--line)"><h3>Checkliste für deinen Brief</h3><p class="small muted">Hake jeden Punkt ab, bevor du deinen Brief abgibst.</p><ul class="checklist">${TRANSFER.check.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></section>
  <div class="foot-row"><span class="small muted">Die Checkliste steht auch auf deinem Merkblatt.</span><button class="btn primary" type="button" id="go">Zum Zeugnis</button></div></div>`;
  $('#go',root).onclick=()=>done();
};

/* ===== Modal, Merkzettel, Lehrkraft ===== */
function modal(html,onOpen){
  modalRoot.innerHTML=`<div class="modal-back"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const back=$('.modal-back',modalRoot);
  back.addEventListener('click',e=>{ if(e.target===back||e.target.closest('[data-close]')) closeModal(); });
  document.addEventListener('keydown',escClose);
  if(onOpen) onOpen($('.modal',modalRoot));
  const c=$('[data-close]',modalRoot); if(c) c.focus();
}
function escClose(e){ if(e.key==='Escape') closeModal(); }
function closeModal(){ modalRoot.innerHTML=''; document.removeEventListener('keydown',escClose); }
function openMerkzettel(){
  const notes=MS.map((m,i)=>({i,n:m.steps[0].note})).filter(x=>S.unlockAll||S.seen.includes('mz'+x.i));
  modal(`<div class="modal-h"><div><span class="eyebrow">Merkzettel</span><h2>Deine Merkzettel</h2></div><button class="btn" type="button" data-close>Schließen</button></div>${notes.length?`<div class="mz-list">${notes.map(x=>noteHtml(x.n)).join('')}</div>`:'<p class="muted">Noch leer. Jede Mission beginnt mit einem Merkzettel.</p>'}`);
}
let teacherOK=false;
function openLehrer(){ modal(`<div class="modal-h"><div><span class="eyebrow">Nur für die Lehrkraft</span><h2>Lehrkraft-Menü</h2></div><button class="btn" type="button" data-close>Schließen</button></div><div id="lehr-body"></div>`,m=>drawLehrer($('#lehr-body',m))); }
function drawLehrer(box){
  if(!teacherOK){
    box.innerHTML='<form id="f-pin" class="fld-group" autocomplete="off"><div class="fld"><label for="in-pin">PIN</label><input type="password" id="in-pin" inputmode="numeric" maxlength="8" autocomplete="off"></div><div class="row"><button class="btn primary" type="submit">Öffnen</button></div><p class="small" id="pin-msg" aria-live="polite"></p></form>';
    $('#f-pin',box).onsubmit=e=>{ e.preventDefault(); if($('#in-pin',box).value.trim()==='5008'){ teacherOK=true; drawLehrer(box); } else { const m=$('#pin-msg',box); m.textContent='Die PIN stimmt nicht.'; m.className='small err-t'; } };
    setTimeout(()=>{ const p=$('#in-pin',box); if(p) p.focus(); },0);
    return;
  }
  box.innerHTML=`<div class="lehr-grid">
  <section class="fld-group"><h3>Ansicht</h3><label class="tgl"><input type="checkbox" id="t-beamer" ${S.beamer?'checked':''}><span>Beamer-Modus mit größerer Schrift</span></label><label class="tgl"><input type="checkbox" id="t-unlock" ${S.unlockAll?'checked':''}><span>Alle Missionen und Merkzettel auf diesem PC freischalten, z. B. zum Vorführen</span></label></section>
  <section class="fld-group"><h3>Code prüfen</h3><p class="small muted">Name und Code vom Zeugnis oder vom Schreibtisch eingeben.</p><div class="fld"><label for="v-name">Vor- und Nachname</label><input type="text" id="v-name" autocomplete="off"></div><div class="fld"><label for="v-code">Code</label><input type="text" id="v-code" class="mono-in" autocomplete="off"></div><div class="row"><button class="btn" type="button" id="v-go">Prüfen</button></div><div id="v-out" aria-live="polite"></div></section>
  <section class="fld-group"><h3>Fortschritt löschen</h3><p class="small muted">Löscht Name und Sterne auf diesem PC, z. B. vor der nächsten Klasse. Ein notierter Code bleibt gültig.</p><div class="row"><button class="btn" type="button" id="r-1">Fortschritt löschen …</button></div><div id="r-confirm"></div></section></div>`;
  $('#t-beamer',box).onchange=e=>{ S.beamer=e.target.checked; save(); document.documentElement.classList.toggle('beamer',S.beamer); };
  $('#t-unlock',box).onchange=e=>{ S.unlockAll=e.target.checked; save(); render(); };
  $('#v-go',box).onclick=()=>{
    const n=$('#v-name',box).value.trim(), st=n?readCode(n,$('#v-code',box).value):null, out=$('#v-out',box);
    if(!st){ out.innerHTML='<p class="small err-t">Ungültig: Der Code passt nicht zu diesem Namen.</p>'; return; }
    let dn=0; const rows=MS.map((m,i)=>{ const ss=scoredOf(i).map(s=>st[s.sid]); const t=ss.reduce((a,b)=>a+b,0); const ok=ss.every(v=>v>0); if(ok&&!m.bonus) dn++; return `<tr><td>${m.bonus?'★':i+1} · ${esc(m.title.replace('Bonus: ',''))}${ok?'':' <span class="muted">(offen)</span>'}</td><td>${t} / ${ss.length*3}</td></tr>`; }).join('');
    out.innerHTML=`<p class="small ok-t">Gültig: ${esc(n)} · ${dn} von ${CORE} Missionen</p><table class="vtbl">${rows}</table>`;
  };
  $('#r-1',box).onclick=()=>{
    $('#r-confirm',box).innerHTML='<p class="small"><b>Wirklich löschen?</b></p><div class="row"><button class="btn primary" type="button" id="r-yes">Ja, löschen</button><button class="btn" type="button" id="r-no">Abbrechen</button></div>';
    $('#r-no',box).onclick=()=>{ $('#r-confirm',box).innerHTML=''; };
    $('#r-yes',box).onclick=()=>{ try{ localStorage.removeItem(KEY); }catch(e){} S.name=''; S.stars=new Array(NS).fill(0); S.pos={}; S.seen=[]; S.vals={}; S.unlockAll=false; save(); closeModal(); go('home'); };
  };
}

load();
render();
})();
