<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Briefprofi Sonnenweg</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: Schreibtisch als Grund, darauf Papierblätter. Kopfleiste mit Luftpost-Streifen.
   Missionsansicht: links die Aufgabe, rechts der wachsende Brief (auf schmalen Bildschirmen darunter).
   Belohnung: Briefmarken im Album, am Ende ein Prüfstempel auf dem eigenen Brief. */
:root{
  --desk:#cdb597; --grain:rgba(90,60,30,.08); --desk-ink:#2e2318;
  --surface:#fffefb; --surface-2:#f5f0e9; --ink:#2a231d; --muted:#6a5e53; --line:#ddd2c4;
  --brand:#23467a; --brand-ink:#ffffff; --brand-soft:#e2e9f4;
  --air-red:#c2413a; --air-blue:#23467a;
  --bar:#1d3150; --bar-ink:#ffffff; --bar-soft:rgba(255,255,255,.12); --bar-line:rgba(255,255,255,.38);
  --sun:#c98d1f; --sun-soft:#fbefd4; --sun-ink:#4d3407; --focus:#d58b1c;
  --ok:#2b6f48; --ok-soft:#dff0e4; --err:#b13d2d; --err-soft:#f7e0da;
  --scrim:rgba(30,20,10,.55);
  --shadow:0 1px 2px rgba(60,40,20,.12),0 8px 22px rgba(60,40,20,.14);
  --note:#fde98c; --note-ink:#2f2709; --note-line:rgba(120,95,20,.25);
  --stamp-red:#b8352c; --stamp-frame:#fffefb;
  --st1:#2f6f8f; --st2:#b0564a; --st3:#4c7a39; --st4:#7c5596; --st5:#b98419; --st6:#2b4d7d; --st7:#5b7d86;
  --av-ink:#ffffff; --av-berger:#7b3f59; --av-mia:#2c6b70; --av-yilmaz:#3d4d89;
  --paper:#ffffff; --paper-ink:#1b1b1b; --paper-muted:#666c74; --paper-line:#c8cdd4; --paper-soft:#f3f5f8;
  --paper-brand:#23467a; --paper-sun:#c98d1f; --paper-wood:#6b4a1f; --paper-hl:#fbefd6;
  --paper-ok:#2b6f48; --paper-ok-soft:#dcefe3; --paper-err:#b13d2d; --paper-err-soft:#f7ddd6; --paper-new:#fff3c2;
  --f-display:"Zilla Slab",Rockwell,Georgia,serif;
  --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --f-letter:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#211a14; --grain:rgba(255,230,200,.035); --desk-ink:#ece2d6;
    --surface:#2a231d; --surface-2:#332a22; --ink:#efe7dd; --muted:#b5a898; --line:#46392e;
    --brand:#93b4e6; --brand-ink:#0f1a2b; --brand-soft:#26324a;
    --bar:#121c2d; --bar-ink:#eef3f8; --bar-soft:rgba(255,255,255,.08); --bar-line:rgba(255,255,255,.25);
    --sun:#e4ad4c; --sun-soft:#3b2e16; --sun-ink:#f6deae; --focus:#e4ad4c;
    --ok:#6cc596; --ok-soft:#183324; --err:#ee8a76; --err-soft:#3d201a;
    --scrim:rgba(0,0,0,.65); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    --note:#e9d47c; --stamp-frame:#efe7dd;
    --av-berger:#a65f7e; --av-mia:#3f8f94; --av-yilmaz:#6475bd;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#211a14; --grain:rgba(255,230,200,.035); --desk-ink:#ece2d6;
  --surface:#2a231d; --surface-2:#332a22; --ink:#efe7dd; --muted:#b5a898; --line:#46392e;
  --brand:#93b4e6; --brand-ink:#0f1a2b; --brand-soft:#26324a;
  --bar:#121c2d; --bar-ink:#eef3f8; --bar-soft:rgba(255,255,255,.08); --bar-line:rgba(255,255,255,.25);
  --sun:#e4ad4c; --sun-soft:#3b2e16; --sun-ink:#f6deae; --focus:#e4ad4c;
  --ok:#6cc596; --ok-soft:#183324; --err:#ee8a76; --err-soft:#3d201a;
  --scrim:rgba(0,0,0,.65); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  --note:#e9d47c; --stamp-frame:#efe7dd;
  --av-berger:#a65f7e; --av-mia:#3f8f94; --av-yilmaz:#6475bd;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html.beamer{font-size:118%}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;
  background-color:var(--desk);
  background-image:repeating-linear-gradient(91deg,transparent 0 37px,var(--grain) 37px 39px,transparent 39px 83px),repeating-linear-gradient(89.4deg,transparent 0 113px,var(--grain) 113px 114px,transparent 114px 197px);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;font-weight:700}
h1{font-size:2.5rem}
h2{font-size:1.75rem}
h3{font-size:1.32rem}
h4{font-size:1.05rem;font-weight:600}
p{margin:0}
ul,ol{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-family:var(--f-body);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ok-t{color:var(--ok);font-weight:700}
.err-t{color:var(--err);font-weight:700}
.kbd{font-family:var(--f-mono);font-size:.82em;padding:.02rem .35rem;border:1px solid currentColor;border-radius:4px;white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopfleiste mit Luftpost-Streifen */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);color:var(--bar-ink);box-shadow:var(--shadow)}
.topbar::after{content:"";display:block;height:6px;background:repeating-linear-gradient(-45deg,var(--air-red) 0 12px,var(--stamp-frame) 12px 18px,var(--air-blue) 18px 30px,var(--stamp-frame) 30px 36px)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:.6rem 1rem;flex-wrap:wrap;padding-block:.5rem}
.brand{display:flex;align-items:center;gap:.6rem;background:none;border:0;color:inherit;cursor:pointer;padding:0;font:inherit;text-align:left}
.brand svg{flex:none}
.brand-t{display:grid;line-height:1.1}
.brand-t b{font-family:var(--f-display);font-size:1.22rem;font-weight:700}
.brand-t small{font-size:.78rem;opacity:.82}
.bar-r{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.22rem .7rem;border-radius:999px;font-size:.86rem;font-weight:600;background:var(--bar-soft);white-space:nowrap}

/* Buttons */
.btn{font:inherit;font-weight:600;line-height:1.2;border-radius:6px;padding:.6rem 1.05rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;gap:.45rem;align-items:center;justify-content:center}
.btn:hover:not([disabled]){border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover:not([disabled]){filter:brightness(1.1)}
.btn.small{padding:.35rem .7rem;font-size:.875rem}
.btn.ghost{background:transparent}
.btn.bar{background:transparent;border-color:var(--bar-line);color:var(--bar-ink)}
.btn.bar:hover{background:var(--bar-soft);border-color:var(--bar-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pick{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.btn.bad{border-color:var(--err);background:var(--err-soft)}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}
.btn:focus-visible,.linkbtn:focus-visible,.opt:focus-visible,.tile:focus-visible,.zone:focus-visible,.chip-btn:focus-visible,.pc:focus-visible,.brand:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* Formulare */
.fld{display:grid;gap:.35rem}
.fld label,.field label{font-weight:600}
input[type=text],input[type=password],textarea{font:inherit;padding:.6rem .75rem;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
input:focus,textarea:focus{outline:3px solid var(--focus);outline-offset:1px;border-color:var(--brand)}
.mono-in{font-family:var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
.fld-group{display:grid;gap:.75rem;padding:1rem;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);align-content:start}
.tgl{display:flex;gap:.55rem;align-items:flex-start;cursor:pointer}
.tgl input{margin-top:.3rem;width:1.05rem;height:1.05rem;accent-color:var(--brand)}

/* Papierflächen */
.main{padding-block:1.4rem 2.5rem;display:grid;gap:1.1rem}
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.4rem}
.foot{padding-block:.5rem 2rem;font-size:.8rem;color:var(--desk-ink);opacity:.85}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.btn.bar{text-decoration:none}
.foot-link{color:inherit;font-weight:600}
.desk-note{color:var(--desk-ink);font-size:.9rem}

/* Haftnotiz */
.note{background:var(--note);color:var(--note-ink);padding:1rem 1.1rem 1.1rem;border-radius:2px;box-shadow:var(--shadow);display:grid;gap:.5rem;position:relative}
.note::before{content:"";position:absolute;top:-9px;left:50%;width:84px;height:18px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,255,255,.45);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.note h4,.note .hand{font-family:var(--f-hand);font-size:1.5rem;font-weight:700;line-height:1}
.note ul{padding-left:1.1rem;display:grid;gap:.1rem}
.note.tilt{transform:rotate(-.8deg)}

/* Start */
.start{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:1.6rem;align-items:start}
@media (max-width:820px){.start{grid-template-columns:minmax(0,1fr)}}
.start-hero{display:grid;gap:1rem}
.start-hero h1{color:var(--brand)}
.lead{font-size:1.12rem;color:var(--muted);max-width:54ch}
.start-forms{display:grid;gap:1rem}
.mission-strip{display:flex;gap:.5rem;flex-wrap:wrap}

/* Briefmarken */
.stamp{--c:var(--st1);display:inline-grid;place-items:center;padding:6px;width:64px;height:76px;background:radial-gradient(circle,transparent 3px,var(--stamp-frame) 3.4px) -6px -6px/12px 12px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));flex:none}
.stamp-in{width:100%;height:100%;background:var(--c);color:var(--av-ink);display:grid;grid-template-rows:1fr auto;place-items:center;padding:4px 2px 3px;border-radius:1px}
.stamp-in svg{width:30px;height:30px}
.stamp-in .sv{font:700 .62rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.stamp.empty{background:none;filter:none;border:2px dashed var(--line);border-radius:3px;padding:0}
.stamp.empty .stamp-in{background:transparent;color:var(--muted)}
.stamp.big{width:96px;height:114px;padding:8px;background-size:14px 14px;background-position:-7px -7px}
.stamp.big .stamp-in svg{width:46px;height:46px}
.stamp.big .stamp-in .sv{font-size:.78rem}
.stamp-stars{font-size:.6rem;letter-spacing:.05em}
.stamp.big .stamp-stars{font-size:.85rem}
.pstamp{display:inline-block;border:3px double var(--stamp-red);color:var(--stamp-red);font:700 .95rem/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.12em;padding:.35rem .7rem;border-radius:6px;transform:rotate(-9deg);text-align:center;opacity:.9}
.pstamp small{display:block;font:600 .62rem/1.2 var(--f-body);letter-spacing:.08em}

/* Schreibtisch (Übersicht) */
.desk-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:1.2rem;align-items:start}
@media (max-width:1000px){.desk-top{grid-template-columns:minmax(0,1fr)}}
.desk-main{display:grid;gap:1.1rem;min-width:0}
.hello{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem 1.5rem;align-items:center}
@media (max-width:640px){.hello{grid-template-columns:minmax(0,1fr)}}
.progress{display:flex;align-items:center;gap:.6rem;margin-top:.6rem;font-weight:600}
.progress .bar{flex:1;max-width:260px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--ok)}
.codebox{display:grid;gap:.2rem;background:var(--surface-2);border:1px dashed var(--line);border-radius:6px;padding:.65rem .85rem}
.code{font-family:var(--f-mono);font-size:1.05rem;letter-spacing:.06em;user-select:all;overflow-wrap:anywhere}
.postcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.pc{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.4rem .8rem;text-align:left;padding:1rem 1rem .9rem 1.1rem;border:0;border-radius:4px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;box-shadow:var(--shadow);align-items:start}
.pc:hover:not([disabled]){transform:translateY(-2px)}
.pc[disabled]{cursor:not-allowed;opacity:.62}
.pc.next{outline:3px solid var(--sun);outline-offset:0}
.pc .pc-body{display:grid;gap:.25rem;min-width:0}
.pc .pc-no{font-family:var(--f-hand);font-size:1.35rem;color:var(--muted);line-height:1}
.pc .pc-title{font-family:var(--f-display);font-weight:700;font-size:1.16rem;line-height:1.15}
.pc .pc-meta{font-size:.85rem;color:var(--muted)}
.pc .pc-lines{grid-column:1/-1;height:16px;background:repeating-linear-gradient(transparent 0 7px,var(--line) 7px 8px);opacity:.7}
.pc.bonus{background:var(--surface-2)}
.pc .tag{font-size:.72rem;font-weight:700;padding:.1rem .45rem;border-radius:999px;background:var(--sun-soft);color:var(--sun-ink);justify-self:start}
.album{display:grid;gap:.7rem}
.album-row{display:flex;flex-wrap:wrap;gap:.6rem}

/* Mission */
.mission{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:1.2rem;align-items:start}
@media (max-width:1000px){.mission{grid-template-columns:minmax(0,1fr)}}
.m-main{display:grid;gap:1.2rem;min-width:0}
.m-head{display:grid;gap:.4rem}
.m-top{display:flex;justify-content:space-between;gap:.75rem;align-items:center;flex-wrap:wrap}
.stepbar{display:flex;gap:4px;margin-top:.3rem}
.stepbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.stepbar i.done{background:var(--ok)}
.stepbar i.now{background:var(--sun)}

/* wachsender Brief */
.m-letter{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:grid;gap:.5rem}
@media (max-width:1000px){.m-letter{position:static}}
.lp-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;color:var(--desk-ink)}
.lp-head .hand{font-family:var(--f-hand);font-size:1.6rem;line-height:1}
.lp-head .btn{background:var(--surface)}
details.lp-fold > summary{list-style:none;cursor:pointer}
details.lp-fold > summary::-webkit-details-marker{display:none}
.lp-sum{display:flex;justify-content:space-between;align-items:center;gap:.5rem;background:var(--surface);border-radius:6px;padding:.6rem .8rem;box-shadow:var(--shadow);font-weight:600}

/* Brief (Papier) */
.letter{background:var(--paper);color:var(--paper-ink);font-family:var(--f-letter);font-size:.84rem;line-height:1.45;box-shadow:var(--shadow);padding:1.4rem 1.5rem 1rem 2.2rem;width:100%;max-width:720px;margin:0 auto;min-width:0;position:relative}
.letter.lp{font-size:.6rem;padding:1rem .9rem .7rem 1.35rem;max-width:none}
.letter.mini{padding:.9rem 1.1rem;box-shadow:none;border:1px solid var(--paper-line)}
.lt-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-bottom:.5em;margin-bottom:1.1em;border-bottom:2px solid var(--paper-brand)}
.lt-head.wood{border-bottom-color:var(--paper-wood)}
.lt-firm{font-family:var(--f-display);font-weight:700;font-size:1.55em;color:var(--paper-brand);line-height:1.05}
.lt-head.wood .lt-firm{color:var(--paper-wood)}
.lt-slogan{font-size:.85em;color:var(--paper-muted)}
.lt-head svg{width:3.6em;height:3.6em;flex:none}
.lt-top{display:grid;grid-template-columns:minmax(11em,1fr) minmax(0,max-content);gap:1.4em;margin-bottom:1.6em}
.letter:not(.lp) .lt-top{min-height:9em}
@media (max-width:560px){.letter:not(.lp) .lt-top{grid-template-columns:minmax(0,1fr)}}
.rsa{font-size:.74em;color:var(--paper-muted);border-bottom:1px solid var(--paper-line);padding-bottom:.15em;margin-bottom:.45em}
.addr .al,.addr .seg{display:block}
.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.1em .8em;line-height:1.5;font-size:.95em;align-content:start;font-family:var(--f-letter);color:var(--paper-ink)}
.info .lw{color:var(--paper-muted);font-size:.88em;white-space:nowrap;padding-top:.07em}
.info .gap{grid-column:1/-1;height:.75em}
.info span{overflow-wrap:anywhere}
.hl{background:var(--paper-hl);border-radius:2px;padding:0 .15em}
.lt-betreff{font-weight:700;margin-bottom:1.3em}
.lt-p{margin:0 0 .85em}
.lt-sig{font-family:var(--f-hand);font-size:1.5em;color:var(--paper-brand);line-height:1}
.lt-sigrow{display:flex;align-items:baseline;gap:.45em;margin:.4em 0 .1em}
.lt-foot{margin-top:1.4em;padding-top:.5em;border-top:1px solid var(--paper-line);font-size:.74em;color:var(--paper-muted);display:grid;gap:.1em}
.lt-foot .seg{display:block}
.slot-ph{border:1.5px dashed var(--paper-line);border-radius:3px;color:var(--paper-muted);font-family:var(--f-body);font-weight:600;font-size:.95em;padding:.45em .6em;margin-bottom:.9em;background:repeating-linear-gradient(-45deg,transparent 0 6px,var(--paper-soft) 6px 12px)}
.lt-top .slot-ph{margin-bottom:0;min-height:7em;display:grid;place-items:center;text-align:center}
.new{animation:glow 2.4s ease-out 1}
@keyframes glow{0%{background:var(--paper-new);box-shadow:0 0 0 4px var(--paper-new)}100%{background:transparent;box-shadow:0 0 0 0 transparent}}
.letter .pstamp{position:absolute;right:8%;bottom:14%;font-size:1.25em}
.letter.lp .pstamp{font-size:.95em;border-width:2px}

/* Gespräch und Merkzettel */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.4rem;align-items:start}
@media (max-width:760px){.intro{grid-template-columns:minmax(0,1fr)}}
.story{display:grid;gap:.85rem;align-content:start}
.say{display:flex;gap:.7rem;align-items:flex-start;animation:rise .35s ease both}
.say:nth-child(2){animation-delay:.25s}
.say:nth-child(3){animation-delay:.5s}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--av-ink);font-family:var(--f-display);font-weight:700;font-size:1rem;flex:none}
.say-b{min-width:0}
.who{font-size:.82rem;color:var(--muted);margin-bottom:.15rem}
.who b{color:var(--ink)}
.bubble{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:.6rem .9rem;font-size:1.04rem}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mz-rows{display:grid;gap:.45rem}
.mz-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.2rem .8rem;align-items:baseline;padding-bottom:.4rem;border-bottom:1px solid var(--note-line)}
.mz-row:last-child{border-bottom:0;padding-bottom:0}
@media (max-width:520px){.mz-row{grid-template-columns:minmax(0,1fr)}}
.mz-row .ex{font-family:var(--f-letter);font-size:.88rem;background:rgba(255,255,255,.55);padding:.1rem .4rem;border-radius:3px;justify-self:start;overflow-wrap:anywhere}
.mz-ref{font-size:.82rem;font-weight:700;opacity:.8}
.mz-visual{background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:.7rem;overflow-x:auto}
.foot-row{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;padding-top:.9rem;border-top:1px dashed var(--line)}

/* Übung */
.ex{display:grid;gap:1rem}
.ex-head{display:grid;gap:.4rem}

/* ===== Fortsetzungscode ===== */
function normName(n){ return String(n).trim().toLowerCase().replace(/\s+/g,' '); }
function fnv(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h>>>0; }
function chk(name,body){ return (fnv(normName(name)+'|'+body)%1296).toString(36).toUpperCase().padStart(2,'0'); }
function makeCode(name,stars){
  let n=0n; for(let i=stars.length-1;i>=0;i--){ n=n*4n+BigInt(stars[i]&3); }
  const body=n.toString(36).toUpperCase().padStart(6,'0');
  return ('C'+body+chk(name,body)).match(/.{1,5}/g).join('-');
}
function readCode(name,code){
  const c=String(code||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
  if(c.length!==9||c[0]!=='C') return null;
  const body=c.slice(1,7);
  if(c.slice(7)!==chk(name,body)) return null;
  let n=0n; for(const ch of body){ const v=parseInt(ch,36); if(isNaN(v)) return null; n=n*36n+BigInt(v); }
  const st=[]; for(let i=0;i<NS;i++){ st.push(Number(n%4n)); n=n/4n; }
  return n===0n?st:null;
}

R.order=(st,root,done)=>{

function fieldMsg(f,v){

  if(v==='') return 'Hier fehlt noch ein Eintrag.';
  for(const h of (f.hints||[])){ if(h.re.test(v)) return h.msg; }
  return f.msg||'Das stimmt noch nicht.';
}

    else { checks++; T.addMist(); setBtns(); T.fb('err',`<b>${wrong===1?'Ein Eintrag stimmt':wrong+' Einträge stimmen'} noch nicht.</b> Lies die roten Hinweise und verbessere.`); const fb=$('.field.bad input',T.body); if(fb) fb.focus(); }

function diagLines(L,t){
  const A=t.answers[0];
  if(!L.length) return 'Du hast noch nichts eingetragen.';
  if(L.some(l=>l==='')) return 'Hier stehen keine Leerzeilen – auch nicht vor dem Ort.';
  if(/^an$/i.test(L[0])) return '„An“ schreibt man nicht in die Anschrift.';
  if(L.some(l=>/^Herr\s/.test(l)||l==='Herr')) return 'In der Anschrift schreibt man „Herrn“ (mit n).';
  if(L.some(l=>/,$/.test(l))) return 'Am Zeilenende stehen keine Kommas.';
  if(t.country){
    const last=L[L.length-1];
    if(last.toUpperCase()===t.country&&last!==t.country) return `Das Land schreibst du in Großbuchstaben: ${t.country}.`;
    if(!L.some(l=>l.toUpperCase()===t.country)) return `Bei Auslandsbriefen steht das Land in der letzten Zeile: ${t.country}.`;
    if(last.toUpperCase()!==t.country) return 'Das Land steht ganz unten in der letzten Zeile.';
  }
  for(let k=0;k<Math.min(L.length,A.length);k++){
    if(!t.answers.some(a=>a[k]===L[k])) return `Zeile ${k+1} stimmt noch nicht. Dort gehört hin: ${t.kinds[k]}.${L[k].toLowerCase()===A[k].toLowerCase()?' Achte auf Groß- und Kleinschreibung.':''}`;
  }
  if(L.length>A.length) return `Du hast ${L.length} Zeilen. Nötig sind nur ${A.length}.`;
  if(L.length<A.length) return `Es fehlt noch eine Zeile: ${t.kinds[L.length]}.`;
  return 'Vergleiche noch einmal genau mit der Vorlage.';
}
R.lines=(st,root,done)=>{

const DATE_HINTS=[{re:/^\d{1,2}\.\d{1,2}\.\d{2}$/,msg:'Schreibe die Jahreszahl vierstellig.'},{re:/^\d\.|\.\d\./,msg:'Tag und Monat schreibst du zweistellig, z. B. 05.06.2027.'},{re:/[a-zäöü]/i,msg:'Im Informationsblock schreibt man das Datum in Ziffern.'}];
const isDate=(v,d)=>{ const p=d.split('.'); return v===d||v===`${p[2]}-${p[1]}-${p[0]}`; };
function dateHint(v){ for(const h of DATE_HINTS) if(h.re.test(v)) return h.msg; return null; }
function textMsg(v,sc){
  const t=v.replace(/\r/g,'').trim();
  if(!t) return 'Hier fehlt noch dein Brieftext.';
  const paras=t.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(paras.length<3) return `Dein Text hat ${paras.length===1?'einen Absatz':paras.length+' Absätze'}. Schreibe 3 Absätze (Einleitung, Hauptteil, Schluss) und trenne sie mit einer Leerzeile: zweimal Enter.`;
  if(paras.length>5) return 'Fasse dich kürzer: höchstens 5 Absätze.';
  const fw=(paras[0].match(/^[^\s,.!?;:]+/)||[''])[0];
  if(/^[A-ZÄÖÜ]/.test(fw)&&!['Sie','Ihre','Ihr','Ihnen','Ihren','Ihrem','Ihrer','Ihres'].includes(fw)) return `Nach der Anrede mit Komma geht der Text klein weiter: „${fw.charAt(0).toLowerCase()+fw.slice(1)} …“.`;
  const fl=t.match(/bezug ?nehmend|\banbei\b|beiliegend|hochachtungsvoll|verbleiben|hiermit teilen wir ihnen mit|\bbetreff\b/i);
  if(fl) return `„${fl[0]}“ ist eine veraltete Floskel. Formuliere einfacher.`;
  for(const m of t.matchAll(/\b(\d{1,2})\.(\d{1,2})\.(\d{2,4})\b/g)){ if(m[1].length!==2||m[2].length!==2||m[3].length!==4) return `Schreibe Daten nach DIN 5008 als TT.MM.JJJJ, z. B. 05.06.2027. Gefunden: „${m[0]}“.`; }
  if(/\b\d{1,2}\.\d{2} ?Uhr\b/.test(t)) return 'Uhrzeiten schreibst du mit Doppelpunkt: 07:30 Uhr.';
  if(/\b\d{1,2}(:\d{2})? ?h\b/.test(t)) return 'Schreibe „Uhr“ statt „h“.';
  if(/\d,-/.test(t)) return 'Schreibe Beträge mit Cent: 89,00 EUR.';
  if(/\d(EUR|€)/.test(t)) return 'Zwischen Betrag und Währung steht ein Leerzeichen.';
  if(/\d%/.test(t)) return 'Vor dem Prozentzeichen steht ein Leerzeichen: 20 %.';
  if(/\bz\.B\./i.test(t)) return 'Abkürzungen mit Leerzeichen: z. B.';
  if(t.replace(/\s+/g,' ').length<150) return 'Dein Text ist noch sehr kurz. Beantworte alle Fragen aus dem Brief.';
  for(const m of (sc.mustText||[])) if(!m.re.test(t)) return m.msg;
  return null;
}

  if(v.length===2&&v.toLowerCase()===ini.split('').reverse().join('')) return 'Fast! Beim Zeichen kommt zuerst der Nachname, dann der Vorname.';
  return 'Dein Zeichen: erster Buchstabe deines Nachnamens, dann deines Vornamens, klein.';
}

   {id:'anrede',grp:'b',label:'Anrede',sol:()=>a.anrede,check:v=>{
     if(v===a.anrede) return null; if(v==='') return 'Hier fehlt noch die Anrede.';
     if(/!$/.test(v)) return 'Nach der Anrede steht ein Komma, kein Ausrufezeichen.'; if(!/,$/.test(v)) return 'Nach der Anrede steht ein Komma.';
     if(/^hallo|^liebe/i.test(v)) return 'Das ist für einen Geschäftsbrief zu locker.';
     if(/damen und herren/i.test(v)&&a.known) return 'Du kennst den Namen: Sprich die Person persönlich an.';
     if(!a.known) return 'Im Brief steht kein Name einer Person. Nimm „Sehr geehrte Damen und Herren,“.';
     if(/geehrter frau|geehrte herr\b/i.test(v)) return 'Bei einer Frau: „Sehr geehrte Frau …“, bei einem Mann: „Sehr geehrter Herr …“.';
     const vn=a.anrede.replace(/,$/,'').split(' ').pop(); if(v.includes(vn)&&v.split(' ').length>4) return 'In der Anrede steht nur der Nachname.';
     return `Sprich ${a.anrede.includes('Herr ')?'den Absender':'die Absenderin'} mit „Sehr geehrte …“ und Nachnamen an.`; }},
   {id:'text',grp:'t',type:'text',label:'Brieftext – 3 Absätze, dazwischen eine Leerzeile',sol:()=>sc.muster,check:v=>textMsg(v,sc)},
   {id:'gruss',grp:'g',label:'Gruß',sol:()=>'Mit freundlichen Grüßen',check:v=>{ if(['Mit freundlichen Grüßen','Freundliche Grüße'].includes(v)) return null; if(v==='') return 'Hier fehlt noch der Gruß.'; if(/,$/.test(v)) return 'Nach dem Gruß steht kein Komma.'; if(/hochachtungsvoll/i.test(v)) return '„Hochachtungsvoll“ ist veraltet.'; if(/^mfg/i.test(v)) return 'Im Gruß schreibt man keine Abkürzung.'; if(/grüssen/i.test(v)) return 'Grüßen schreibt man mit ß.'; return 'Der übliche Gruß lautet „Mit freundlichen Grüßen“.'; }},
   {id:'zusatz',grp:'g',label:'Zusatz vor der Unterschrift',sol:()=>'i. A.',check:v=>{ if(v==='i. A.') return null; if(v==='') return 'Du unterschreibst als Azubi im Auftrag. Dafür steht ein Zusatz vor der Unterschrift.'; if(/^i\.? ?v\.?$/i.test(v)) return '„i. V.“ darf nur, wer die Chefin mit Vollmacht vertritt. Du bist Azubi: i. A.'; if(/^i\.a\.$/i.test(v)) return 'Nach dem ersten Punkt steht ein Leerzeichen: i. A.'; return 'Du unterschreibst im Auftrag: i. A.'; }},
   {id:'uname',grp:'g',label:'Name unter der Unterschrift',sol:()=>ME().name,check:v=>{ const n=ME().name; if(v===n) return null; if(v==='') return 'Hier fehlt noch dein Name.'; if(v.toLowerCase()===n.toLowerCase()) return 'Achte auf Groß- und Kleinschreibung.'; return 'Unter die Unterschrift kommt dein Vor- und Nachname.'; }},
   {id:'anlage',grp:'g',label:a.anlage?'Anlagenvermerk':'Anlagenvermerk (nur wenn etwas beiliegt)',ph:'(leer lassen, wenn nichts beiliegt)',sol:()=>a.anlage?'Anlage':'',check:v=>{
     const ok=a.anlage?/^anlage:?$/i.test(v):v===''; if(ok) return null;
     if(!a.anlage) return 'Diesem Brief liegt nichts bei. Lass das Feld leer.';
     if(v==='') return `Du schickst etwas mit: ${a.anlageName}. Dafür brauchst du einen Anlagenvermerk.`;
     if(/^anlagen/i.test(v)) return 'Es liegt nur eine Sache bei: „Anlage“ in der Einzahl.';
     return 'Der Vermerk heißt einfach „Anlage“.'; }}
  ];
}

/* --- Ansichten --- */
function envHtml(sc){
  const st=S.ueb[sc.id]|0;
  return `<button class="env" type="button" data-id="${sc.id}"><span class="env-in"><span class="env-from">Von: ${esc(sc.from)}</span><span class="env-t">${esc(sc.thema)}</span><span class="env-meta"><span class="chip lv-${sc.level}">${esc(sc.level)}</span>${st?`<span class="ok-t">beantwortet</span> ${starsHtml(st,3)}`:'<span class="muted">offen</span>'}</span></span></button>`;
}
function renderPost(){
  main.innerHTML=`<section class="panel post-head"><div class="intro"><div class="story"><div class="say">${avHtml('berger')}<div class="say-b"><div class="who"><b>${esc(P.berger.name)}</b> · ${esc(P.berger.role)}</div><div class="bubble">Probezeit bestanden, ${esc(ME().first)}! Ab jetzt beantwortest du die Post selbst. Heute ist der ${HEUTE_UEB}. Du unterschreibst mit „i. A.“, und jeder Brief geht durch meinen Chef-Check.</div></div></div></div>
  <div class="note tilt"><span class="hand">So gehst du vor</span><ul><li>Brief lesen: Wer schreibt? Was will er?</li><li>Anschrift und Informationsblock aus dem Brief übernehmen</li><li>Betreff, Anrede und 3 Absätze schreiben</li><li>Prüfen, verbessern, abschicken</li></ul></div></div></section>
  <div class="row" style="justify-content:space-between"><h2 class="desk-h">Posteingang <span class="small">${postDone()} von ${POST.length} beantwortet</span></h2><button class="btn small" type="button" id="b-back">← Zum Schreibtisch</button></div>
  <section class="env-list" aria-label="Briefe im Posteingang">${POST.map(envHtml).join('')}</section>`;
  $('#b-back').onclick=()=>go('home');
  $$('.env',main).forEach(b=>b.onclick=()=>go('brief',{pid:b.dataset.id}));
}
function renderBrief(){
  const sc=postById(V.pid); if(!sc){ go('post'); return; }
  const F=postFields(sc), dr=(S.drafts[sc.id]=S.drafts[sc.id]||{});
  const grp=(g,title,no)=>`<fieldset class="fs"><legend><span class="fs-no">${no}</span>${title}</legend>${F.filter(f=>f.grp===g).map(f=>{
    const id='pf-'+f.id, ro=typeof f.ro==='function'?f.ro():f.ro;
    if(ro) return `<div class="field ro"><label for="${id}">${esc(f.label)}</label><input type="text" id="${id}" value="${esc(ro)}" readonly tabindex="-1"><div class="f-msg">steht schon in deiner Vorlage</div></div>`;
    if(f.type) return `<div class="field wide" data-f="${f.id}"><label for="${id}">${esc(f.label)}</label><textarea id="${id}" class="${f.type==='lines'?'addr-in':'text-in'}" rows="${f.type==='lines'?6:11}" spellcheck="${f.type==='text'}">${esc(dr[f.id]||'')}</textarea><div class="f-msg"></div></div>`;
    return `<div class="field" data-f="${f.id}"><label for="${id}">${esc(f.label)}</label><input type="text" id="${id}" value="${esc(dr[f.id]||'')}" spellcheck="false" autocomplete="off"${f.ph?` placeholder="${esc(f.ph)}"`:''}><div class="f-msg"></div></div>`;
  }).join('')}</fieldset>`;
  main.innerHTML=`<div class="row"><button class="linkbtn" type="button" id="b-back">← Zum Posteingang</button></div>
  <div class="ub"><section class="ub-in" aria-label="Eingegangener Brief"><div class="ub-lab"><span class="eyebrow">Eingegangen</span><span class="chip lv-${sc.level}">${esc(sc.level)}</span></div>${inLetterHtml(sc)}</section>
  <section class="panel ub-form"><div class="ex-head"><span class="eyebrow">Deine Antwort · heute ist der ${HEUTE_UEB}</span><h2>Antwort an ${esc(sc.from)}</h2><p class="task">Beantworte den Brief. Übernimm die Angaben aus dem Brief und schreibe einen eigenen Text.</p></div>
  <div class="hint-area"></div>
  <form id="pform" autocomplete="off" novalidate>${grp('a','Anschriftfeld','2')}${grp('i','Informationsblock','3')}${grp('b','Betreff und Anrede','4–5')}${grp('t','Brieftext','6')}${grp('g','Gruß, Unterschrift, Anlage','7–9')}</form>
  <div class="fb-area" aria-live="polite"></div>
  <div class="ex-foot"><div class="left"><button class="btn small ghost" type="button" id="p-hint">Frag Mia</button><span class="mist">Prüfungen mit Fehlern: <b id="p-mist">0</b></span></div><div class="right" id="p-right"></div></div></section></div>`;
  const P0={mist:0,hint:false,sol:false};
  $('#b-back').onclick=()=>go('post');
  let tmr=null;
  $('#pform').addEventListener('input',e=>{ const f=e.target.closest('[data-f]'); if(!f) return; dr[f.dataset.f]=e.target.value; clearTimeout(tmr); tmr=setTimeout(save,400); });
  cleanups.push(()=>{ clearTimeout(tmr); save(); });
  $('#p-hint').onclick=()=>{ P0.hint=true; $('.hint-area',main).innerHTML=`<div class="note hintbox">${avHtml('mia')}<div><span class="hand">Mia hilft dir</span><div>${esc(sc.hint)}</div><div class="small">Ein Tipp kostet dich höchstens einen Stern.</div></div></div>`; };
  const right=$('#p-right'), fb=$('.fb-area',main);
  function btns(){ right.innerHTML=`${P0.mist>=2?'<button class="btn" type="button" id="p-sol">Lösung zeigen</button>':''}<button class="btn primary" type="button" id="p-check">Brief prüfen</button>`; $('#p-check').onclick=check; const s=$('#p-sol'); if(s) s.onclick=solve; }
  function val(f){ const el=$('#pf-'+f.id); const v=el.value; return f.type?v:v.replace(/\s+/g,' ').trim(); }
  function check(){
    let wrong=0, first=null;
    F.filter(f=>f.check).forEach(f=>{ const fd=$(`[data-f="${f.id}"]`,main), m=f.check(val(f)); fd.classList.toggle('ok',m===null); fd.classList.toggle('bad',m!==null); $('.f-msg',fd).textContent=m===null?'✓':m; if(m!==null){ wrong++; if(!first) first=fd; } });
    if(wrong){ P0.mist++; $('#p-mist').textContent=P0.mist; btns(); fb.innerHTML=`<div class="fb err"><b>${wrong===1?'Eine Stelle':wrong+' Stellen'} im Brief ${wrong===1?'stimmt':'stimmen'} noch nicht.</b> Lies die roten Hinweise und verbessere.</div>`; try{ first.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){} const fi=$('input,textarea',first); if(fi) setTimeout(()=>fi.focus({preventScroll:true}),350); }
    else preview();
  }
  function solve(){ P0.sol=true; F.filter(f=>f.sol).forEach(f=>{ const el=$('#pf-'+f.id); if(f.check(val(f))!==null){ el.value=f.sol(); dr[f.id]=el.value; } }); save(); check(); }
  function preview(){
    const g=id=>val(F.find(f=>f.id===id)), a=sc.ans;
    const addr=g('addr').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const paras=g('text').replace(/\r/g,'').trim().split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
    const rows=[['Ihr Zeichen',g('ihrZ')],['Ihre Nachricht vom',g('ihreN')],['Unser Zeichen',g('unsZ')],['Unsere Nachricht vom',g('unsN')],null,['Name',g('name')],['Telefon','08136 8090-15'],['E-Mail',ME().mail],null,['Datum',g('datum')]].filter(r=>r===null||r[1]);
    const letter=`<div class="letter">${LH}<div class="lt-top"><div><div class="rsa">${RSA}</div><div class="addr">${addr.map(l=>`<span class="al">${esc(l)}</span>`).join('')}</div></div><div class="info">${rows.map(r=>r?`<span class="lw">${esc(r[0])}:</span><span>${esc(r[1])}</span>`:'<span class="gap"></span>').join('')}</div></div>
      <div class="lt-betreff">${esc(g('betreff'))}</div><p class="lt-p">${esc(g('anrede'))}</p>${paras.map(p=>`<p class="lt-p">${esc(p).replace(/(\d) (EUR|€|Uhr|%)/g,'$1&nbsp;$2').replace(/\n/g,'<br>')}</p>`).join('')}<p class="lt-p">${esc(g('gruss'))}</p><p class="lt-p" style="margin-bottom:0">Reisebüro Sonnenweg GmbH</p>
      <div class="lt-sigrow"><span>${esc(g('zusatz'))}</span><span class="lt-sig">${esc(ME().first.charAt(0)+'. '+ME().name.split(' ').pop())}</span></div><p class="lt-p">${esc(g('uname'))}</p>${a.anlage?`<p class="lt-p"><b>${esc(g('anlage').replace(/:$/,''))}</b><br>${esc(a.anlageName)}</p>`:''}${FOOT}<span class="pstamp">Geprüft<small>K. Berger · Reisebüro Sonnenweg</small></span></div>`;
    fb.innerHTML=`<div class="fb ok"><b>Die Form stimmt!</b> So sieht dein Brief aus. Prüfe jetzt den Inhalt selbst.</div>`;
    right.innerHTML='';
    const box=document.createElement('div'); box.className='pv'; box.innerHTML=`${letter}<div class="pv-check"><h3>Inhalt prüfen: Hast du an alles gedacht?</h3><ul class="cl">${sc.checklist.map((c,i)=>`<li><label class="tgl"><input type="checkbox" id="cl-${i}"><span>${esc(c)}</span></label></li>`).join('')}</ul><div class="row"><button class="btn" type="button" id="p-edit">Noch einmal bearbeiten</button><button class="btn primary" type="button" id="p-send" disabled>Brief abschicken</button></div></div>`;
    fb.after(box); $('#pform').hidden=true; $('.hint-area',main).hidden=true; $('.ub',main).classList.add('pv-mode'); $('.ub-lab .eyebrow',main).textContent='Zum Vergleich: der eingegangene Brief';
    const send=$('#p-send',box), cbs=$$('input[type=checkbox]',box);
    cbs.forEach(c=>c.onchange=()=>{ send.disabled=!cbs.every(x=>x.checked); });
    $('#p-edit',box).onclick=()=>{ box.remove(); $('#pform').hidden=false; $('.hint-area',main).hidden=false; $('.ub',main).classList.remove('pv-mode'); $('.ub-lab .eyebrow',main).textContent='Eingegangen'; fb.innerHTML=''; btns(); };
    send.onclick=()=>{
      let s=P0.sol?1:(P0.mist===0?3:P0.mist<=2?2:1); if(P0.hint) s=Math.min(s,2);
      S.ueb[sc.id]=Math.max(S.ueb[sc.id]|0,s); delete S.drafts[sc.id]; save();
      box.innerHTML=`<div class="done-grid"><span class="stamp big" style="--c:var(--st2)"><span class="stamp-in"><svg viewBox="0 0 40 40" aria-hidden="true">${MOTIF.post}</svg><span class="sv">Post</span><span class="stamp-stars">${'★'.repeat(s)}<span style="opacity:.35">${'★'.repeat(3-s)}</span></span></span></span><div class="done-text"><span class="eyebrow">Abgeschickt</span><h2>Dein Brief ist unterwegs!</h2><p>${['','Geschafft. Beim nächsten Brief klappt es noch besser.','Gut gemacht!','Perfekt, schon beim ersten Prüfen richtig!'][s]}</p><div class="row"><button class="btn primary" type="button" id="p-next">Zum Posteingang</button></div></div></div>`;
      $('#p-next',box).onclick=()=>go('post');
      try{ box.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){}
    };
    try{ fb.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){}
  }
  btns();
}
load();
render();
})();
</script>
